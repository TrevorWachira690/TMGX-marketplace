<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TBM-DeepIn Admin</title>
    <!--
      This file exists to match the required folder structure for the
      admin frontend group (Student 3 & 4). The actual admin panel is a
      React route (see src/pages/AdminDashboard.jsx), rendered through
      the same single-page app as the public site, at the "/admin" path.
      This static file redirects there so a direct link to admin.html
      still lands in the right place.
    -->
    <meta http-equiv="refresh" content="0; url=/admin" />
  </head>
  <body>
    <p>Redirecting to the admin dashboard...</p>
    <p>If you are not redirected, <a href="/admin">click here</a>.</p>
  </body>
</html>
